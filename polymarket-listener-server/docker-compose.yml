version: '3.8'

services:
  polymarket-listener:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: polymarket-listener-server
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
    environment:
      # Required Supabase configuration
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      
      # Server configuration
      - PORT=${PORT:-3002}
      - POLL_INTERVAL=${POLL_INTERVAL:-30000}
      
      # Optional configuration
      - BUILDER_SIGNING_SERVER_URL=${BUILDER_SIGNING_SERVER_URL:-http://localhost:3001}
      - MONITOR_USERS=${MONITOR_USERS:-}
      
      # Node environment
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - polymarket-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Uncomment to add volume for persistent logs
    # volumes:
    #   - ./logs:/app/logs

networks:
  polymarket-network:
    driver: bridge

