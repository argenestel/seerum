version: '3.8'

services:
  polymarket-listener:
    build: .
    container_name: polymarket-listener-server
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - PORT=${PORT:-3002}
      - POLL_INTERVAL=${POLL_INTERVAL:-30000}
      - BUILDER_SIGNING_SERVER_URL=${BUILDER_SIGNING_SERVER_URL:-http://localhost:3001}
      - MONITOR_USERS=${MONITOR_USERS:-}
      - NODE_ENV=production
